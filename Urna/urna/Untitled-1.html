<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="urna">
    <!-- TELA DA URNA -->
    <div class="tela" id="tela">
        <div class="layout-voto">
            <div class="info-esquerda">
                <div class="topo-voto" id="topo-voto">SEU VOTO VAI PARA:</div>
                <h2 id="cargo">VEREADOR</h2>
                
                <div class="rotulo-numero">Número:</div>
                <!-- Caixas dos números que serão preenchidas via JavaScript -->
                <div class="container-numeros" id="container-numeros"></div>
                
                <div id="dados-candidato" class="dados-candidato"></div>
            </div>
            
            <div class="foto-direita">
                <img id="foto-candidato" class="foto-cand" src="" alt="Foto">
            </div>
        </div>
        
        <div class="instrucoes">
            Aperte a tecla:<br>
            <span class="txt-verde">CONFIRMA</span> para APROVAR este voto<br>
            <span class="txt-laranja">CORRIGE</span> para REINICIAR este voto
        </div>
    </div>

    <!-- TECLADO DA URNA -->
    <div class="teclado">
        <button onclick="inserir('1')">1</button>
        <button onclick="inserir('2')">2</button>
        <button onclick="inserir('3')">3</button>
        <button onclick="inserir('4')">4</button>
        <button onclick="inserir('5')">5</button>
        <button onclick="inserir('6')">6</button>
        <button onclick="inserir('7')">7</button>
        <button onclick="inserir('8')">8</button>
        <button onclick="inserir('9')">9</button>
        <button class="btn-zero" onclick="inserir('0')">0</button>
        
        <!-- Botões de Controle -->
        <button class="btn-branco" onclick="votoBranco()">BRANCO</button>
        <button class="btn-corrige" onclick="corrige()">CORRIGE</button>
        <button class="btn-confirma" onclick="confirma()">CONFIRMA</button>
    </div>
</div>

<!-- Vincula o arquivo JavaScript externo -->
<script src="script.js"></script>
</body>
</html>
